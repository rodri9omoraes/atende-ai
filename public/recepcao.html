<!DOCTYPE html>
<html lang="pr-BR">
    <head>
        <meta chatset="UTF-8">
        <title> Atende Aí </title>
        <style>
            * { box-sizing: border-box; }

            body {
                font-family: 'Segoe UI', Arial, sans-serif;
                background: linear-gradient(135deg, #e8f0fe, #f4f4f4);
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                margin: 0;
            }

            .card {
                background: white;
                border-radius: 16px;
                box-shadow: 0 8px 24px rbga(0,0,0,0.1);
                padding: 40px;
                width: 420px;
                text-align: center;
            }
            
            h1 { color: #333; margin-bottom: 20px; }

            #status {
                font-size: 18px;
                margin-bottom: 25px;
                padding: 12px;
                border-radius: 10px;
                font-weight: 600;
                transition: 0.3s;
            }

            .sala { background: #d4edda; color: #155724;}
            .fora { background: #f8d7da; color: #721c24;}

            input, textarea {
                width: 100%;
                padding: 12px;
                margin-bottom: 14px;
                border: 1px solid #ddd;
                border-radius: 8px;
                font-size: 15px;
                font-family: inherit;
            }

            textarea { resize: vertical; min-height: 70px; }

            button {
                width: 100%;
                font-size: 17px;
                padding: 14px;
                cursor: pointer;
                border: none;
                border-radius: 10px;
                background: #007bff;
                color: white;
                font-weight: 600;
                transition: 0.2s;
            }

            button:hover { background: #0056b3; }

            #resposta {
                font-size: 17px;
                margin-top: 20px;
                font-weight: 600;
                min-height: 24px;
            }
        </style>
    </head>

    <body>
        
        <div class="card">
            <h1>Atende Aí</h1>
            <p style="color: #666; margin-top: -15px;">Recepção</p>
            
            <div id="status">Verificando Status...</div>
            
            <br>
            <input type="text" id="nome" placeholder="Nome da Pessoa">
            <textarea id="mensagem" placeholder="O que ela deseja trata com a Assistente Social?"></textarea>
            <br>

            <button onclick="chamar()"> Avisar Assistente Social</button>
            <div id="resposta"></div>
        </div>
        
        <script src="/socket.io/socket.io.js"></script>
        <script>
            const socket = io();

            socket.on('status-atual', (status) => {
                const el = document.getElementById('status');
                if (status === 'sala') {
                    el.textContent = '🟢 Estou na sala';
                    el.className = 'sala';
                } else {
                    el.textContent = '🔴 NÃO estou na sala';
                    el.className = 'fora';
                }
            });

            socket.on('resposta-recebida', (podeAtender) => {
                const el = document.getElementById('resposta');
                el.textContent = podeAtender ? '✅ Pode encaminhar!' : '⏳ Peça para aguarda, um instante';
            });

            function chamar(){
                const nome = document.getElementById('nome').value.trim();
                const mensagem = document.getElementById('mensagem').value.trim();

                if (!nome) {
                    alert('Por favor, informe o nome da pessoa.');
                    return;
                }

                socket.emit('chamar', { nome, mensagem });
                document.getElementById('resposta').textContent = 'Avisando...';
            }
        </script>
    </body>
</html>
