<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <style>

    html, body {
      margin: 0;
      background: transparent;
      overflow: hidden;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: rgba(255,255,255,0.95);
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      -webkit-app-region: drag; /* permite arrastar a janelinha */
      user-select: none;
      height: 100%;
      box-sizing: border-box;
    }
    .texto { font-size: 12px; font-weight: 600; color: #333; }
    .switch {
      -webkit-app-region: no-drag;
      width: 36px;
      height: 20px;
      border-radius: 999px;
      background: #dc3545;
      position: relative;
      cursor: pointer;
      transition: 0.2s;
      flex-shrink: 0;
    }
    .switch.ativo { background: #28a745; }
    .switch .bolinha {
      width: 14px;
      height: 14px;
      background: white;
      border-radius: 50%;
      position: absolute;
      top: 3px;
      left: 3px;
      transition: 0.2s;
    }
    .switch.ativo .bolinha { left: 19px; }
  </style>
</head>
<body>
  <div class="switch" id="switchStatus" onclick="alternar()">
    <div class="bolinha"></div>
  </div>
  <div class="texto" id="texto">Verificando...</div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let statusAtual = 'sala';

    socket.on('status-atual', (status) => {
      statusAtual = status;
      const sw = document.getElementById('switchStatus');
      const texto = document.getElementById('texto');
      if (status === 'sala') {
        sw.classList.add('ativo');
        texto.textContent = ' Na sala';
      } else {
        sw.classList.remove('ativo');
        texto.textContent = ' Fora da sala';
      }
    });

    function alternar() {
      statusAtual = statusAtual === 'sala' ? 'fora' : 'sala';
      socket.emit('mudar-status', statusAtual);
    }
  </script>
</body>
</html>
